<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">FixLoop single-case offline evaluation result</title>
  <desc id="desc">Terminal-style view showing case_001 passing independent verification with a one-line patch.</desc>
  <rect width="1120" height="440" rx="18" fill="#0d1117"/>
  <rect width="1120" height="54" rx="18" fill="#161b22"/>
  <rect y="36" width="1120" height="18" fill="#161b22"/>
  <circle cx="30" cy="27" r="8" fill="#ff5f56"/>
  <circle cx="56" cy="27" r="8" fill="#ffbd2e"/>
  <circle cx="82" cy="27" r="8" fill="#27c93f"/>
  <text x="560" y="34" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="16">FixLoop · offline evaluation</text>
  <g font-family="Consolas, monospace" font-size="19">
    <text x="28" y="94" fill="#7ee787">$</text>
    <text x="52" y="94" fill="#c9d1d9">python -m src.cli eval --case case_001 --fake --markdown --verbose</text>
    <text x="28" y="142" fill="#7ee787">[OK]</text>
    <text x="88" y="142" fill="#c9d1d9">case_001</text>
    <text x="220" y="142" fill="#8b949e">type=type_error  fixed=True  retries=0</text>
    <text x="28" y="184" fill="#8b949e">patch</text>
    <text x="100" y="184" fill="#c9d1d9">lines=1/1</text>
    <text x="28" y="226" fill="#f85149">- return unit_price + count</text>
    <text x="28" y="268" fill="#7ee787">+ return int(unit_price) * count</text>
    <text x="28" y="320" fill="#58a6ff">Verifier</text>
    <text x="135" y="320" fill="#c9d1d9">pytest passed · no regression detected</text>
    <text x="28" y="366" fill="#8b949e">Report</text>
    <text x="112" y="366" fill="#c9d1d9">eval_results/eval_report.json</text>
    <text x="28" y="408" fill="#7ee787">✓ repair closed with auditable evidence</text>
  </g>
</svg>
